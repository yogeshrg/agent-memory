version: "3.8"

services:
  agent-memory:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: agent-memory
    ports:
      - "8002:8002"
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  memory_data: